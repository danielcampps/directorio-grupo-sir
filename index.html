<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Directorio Grupo SIR</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17314b;background:#eef4fa}*{box-sizing:border-box}body{margin:0;padding:24px 12px}.wrap{max-width:760px;margin:auto}.brand{display:flex;justify-content:center;margin:12px auto 20px}.brand img{width:170px;max-height:100px;object-fit:contain}.card{background:white;border-radius:24px;overflow:hidden;box-shadow:0 10px 40px #123e661e;margin:0 auto 22px;max-width:480px}.hero{background:linear-gradient(135deg,#00518c,#1288ca);color:white;text-align:center;padding:32px 20px 24px}.photo,.initials{width:128px;height:128px;object-fit:cover;border-radius:50%;border:5px solid white;background:#e6f3fb;margin:auto}.initials{display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:750;color:#00518c}.hero h1{font-size:24px;margin:14px 0 4px}.hero p{margin:0;font-size:15px}.details{padding:22px}.details p{margin:9px 0;overflow-wrap:anywhere}.details a{color:#075d99}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.btn{display:block;text-align:center;border:0;border-radius:11px;background:#006eaf;color:white!important;padding:12px 8px;text-decoration:none;font-weight:650;cursor:pointer;font-size:14px}.btn.secondary{background:#e7f2f9;color:#00518c!important}.btn.wide{grid-column:1/-1}.muted{font-size:13px;color:#62788c}.directory{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{background:white;border-radius:16px;padding:18px;text-decoration:none;color:#17314b;box-shadow:0 4px 15px #123e6611}.tile strong{display:block;margin-bottom:6px}.tile small{color:#526e82}footer{text-align:center;color:#688096;font-size:12px;margin:24px 0}</style></head><body><div class="wrap"><div class="brand"><img src="logo-grupo-sir.jpg" alt="Grupo SIR"></div><main id="app"></main><footer>Grupo SIR · Donde la Energía cobra sentido</footer></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const vcEscape=s=>String(s??'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
function vcard(p){let lines=['BEGIN:VCARD','VERSION:3.0','FN:'+vcEscape(p.nombre),'ORG:'+vcEscape(p.empresa),'TITLE:'+vcEscape(p.cargo),'TEL;TYPE=CELL:+506'+p.telefono.replace(/\D/g,'')];if(p.correo)lines.push('EMAIL:'+p.correo);if(p.web)lines.push('URL:'+p.web);if(p.cedula)lines.push('NOTE:Cédula '+vcEscape(p.cedula));lines.push('END:VCARD');return lines.join('\r\n')+'\r\n'}
function save(p){let url=URL.createObjectURL(new Blob([vcard(p)],{type:'text/vcard;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download=p.id+'.vcf';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
fetch('colaboradores.json').then(r=>{if(!r.ok)throw Error('No disponible');return r.json()}).then(data=>{let id=new URLSearchParams(location.search).get('id');let p=data.find(x=>x.id===id);let app=document.getElementById('app');if(!p){app.innerHTML='<h1 style="text-align:center">Directorio de colaboradores</h1><div class="directory">'+data.map(x=>'<a class="tile" href="?id='+encodeURIComponent(x.id)+'"><strong>'+esc(x.nombre)+'</strong><small>'+esc(x.cargo)+'</small></a>').join('')+'</div>';return}document.title=p.nombre+' | Grupo SIR';let tel=p.telefono.replace(/\D/g,'');let portrait=p.foto?'<img class="photo" src="'+encodeURI(p.foto)+'" alt="Fotografía de '+esc(p.nombre)+'">':'<div class="initials" aria-label="Fotografía pendiente">'+esc(initials(p.nombre))+'</div>';let email=p.correo?'<p><strong>Correo:</strong> <a href="mailto:'+encodeURIComponent(p.correo)+'">'+esc(p.correo)+'</a></p>':'';let web=p.web?'<p><strong>Web:</strong> <a href="'+esc(p.web)+'" rel="noopener">'+esc(p.web)+'</a></p>':'';let emailBtn=p.correo?'<a class="btn secondary" href="mailto:'+encodeURIComponent(p.correo)+'">Correo</a>':'';app.innerHTML='<article class="card"><div class="hero">'+portrait+'<h1>'+esc(p.nombre)+'</h1><p>'+esc(p.cargo)+'</p></div><div class="details"><p><strong>Empresa:</strong> '+esc(p.empresa)+'</p>'+(p.cedula?'<p><strong>Cédula:</strong> '+esc(p.cedula)+'</p>':'')+'<p><strong>Teléfono:</strong> +506 '+esc(p.telefono)+'</p>'+email+web+'<div class="actions"><a class="btn" href="https://wa.me/506'+tel+'">WhatsApp</a><a class="btn" href="tel:+506'+tel+'">Llamar</a>'+emailBtn+'<button class="btn wide" id="save">Guardar contacto</button></div></div></article><p style="text-align:center"><a href="./">Ver directorio completo</a></p>';document.getElementById('save').onclick=()=>save(p)}).catch(()=>document.getElementById('app').textContent='No se pudo cargar el directorio. Publícalo en GitHub Pages para visualizarlo.');
</script></body></html>
